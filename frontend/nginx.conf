# Serves the built dashboard (index.html) and fridge simulator (simulator.html),
# and forwards /api to the backend, as the Vite dev server does in development.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Fridge readings carry a PNG per row.
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
