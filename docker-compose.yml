services:
  db:
    image: postgres:17
    container_name: smart-fridge-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_fridge}
      POSTGRES_USER: ${POSTGRES_USER:-smart_fridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_fridge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Scripts here run once, when the data volume is first created.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
