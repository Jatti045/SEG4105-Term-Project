services:
  db:
    image: postgres:17
    container_name: smart-fridge-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_fridge}
      POSTGRES_USER: ${POSTGRES_USER:-smart_fridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_fridge}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Scripts here run once, when the data volume is first created.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FastAPI: the dashboard, fridge, and recognition APIs.
  backend:
    build: ./backend
    container_name: smart-fridge-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smart_fridge}:${POSTGRES_PASSWORD:-smart_fridge}@db:5432/${POSTGRES_DB:-smart_fridge}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The manager dashboard (/) and the fridge simulator (/simulator.html).
  frontend:
    build: ./frontend
    container_name: smart-fridge-frontend
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
